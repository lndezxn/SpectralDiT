data:
  type: imagenet100_latents
  latent_root: datasets/imagenet-100/processed/imagenet-100_vae_latents_32
  image_root: datasets/imagenet-100/processed/imagenet-100_256
  vae: datasets/vae
  scaling_factor: 0.18215
  batch_size: 256
  num_workers: 4
  pin_memory: true

model:
  name: dit_s2
  image_size: 32
  patch_size: 2
  in_channels: 4
  num_classes: 100
  class_dropout_prob: 0.1
  pos_embed_type: 2d_sincos
  activation_checkpointing: false
  freq_residual_gating:
    enabled: false
    gate_scale: 1.0

train:
  seed: 42
  output_dir: outputs/imagenet100_dit_s2
  mixed_precision: bf16
  grad_accum_steps: 1
  max_steps: 400000
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  warmup_steps: 5000
  ema_decay: 0.9999
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.99
  grad_clip: 1.0
  log_every: 500
  eval_every: 10000
  save_every: 10000
  resume_from: null

sample:
  num_steps: 50
  num_samples: 64
  cfg_scale: 1.0
  debug:
    enabled: false
    output_subdir: debug_tokens
    save_dtype: float32

eval:
  batch_size: 128
  sample_batch_size: 128
  num_workers: 0
  fid_num_samples: 10000
  num_real: null
  real_split: validation
  image_size: 256
  decode_dtype: bf16
