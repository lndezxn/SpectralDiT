model:
  name: dit_plain_small
  image_size: 32
  patch_size: 1
  in_channels: 3
  num_classes: 10
  class_dropout_prob: 0.1
  pos_embed_type: 2d_sincos
  activation_checkpointing: true
  freq_residual_gating:
    enabled: true
    condition_on: time
    gate_scale: 1.0

train:
  output_dir: outputs/cifar10_spectraldit_small_sample


sample:
  num_steps: 16
  num_samples: 1
  debug:
    enabled: true
    output_subdir: debug_tokens
    save_dtype: float32
